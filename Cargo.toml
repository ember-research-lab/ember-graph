[package]
name = "ember-graph"
description = "A reusable, zero-dependency knowledge-graph engine for the Ember stack. A clean-room reimplementation of the Graphify patterns (typed node/edge model + discrete EXTRACTED/INFERRED/AMBIGUOUS confidence rubric + a token-budgeted BFS query primitive) as a multi-consumer Ember capability — the SMB platform's business graph, the research repos, agent context. No vector DB, no third-party deps."
version = "0.1.0"
edition = "2021"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[features]
# The crypto adapter: real Signer/Verifier impls for the provenance envelope, backed by ember-crypto
# (Ed25519 today, ML-DSA/hybrid additive). OFF by default — the engine core stays zero-dependency; a
# consumer (the SMB platform) opts in. See design/trust-model.md.
crypto = ["dep:ember-crypto"]

[dependencies]
# Optional, behind the `crypto` feature only — the core remains zero-dep.
ember-crypto = { git = "https://github.com/ember-research-lab/ember-crypto", tag = "v0.1.0", optional = true }
